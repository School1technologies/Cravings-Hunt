services:
  - type: web
    name: cravings-hunt
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /var/data/data.json
      - key: APP_SECRET
        generateValue: true
      - key: SUPER_PASSWORD
        generateValue: true
      - key: DEMO_PIN
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
